services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sheetbridge
      POSTGRES_USER: sheetbridge
      POSTGRES_PASSWORD: sheetbridge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sheetbridge"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      POSTGRES_HOST: postgres
      POSTGRES_DB: sheetbridge
      POSTGRES_USER: sheetbridge
      POSTGRES_PASSWORD: sheetbridge
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  pgdata:
