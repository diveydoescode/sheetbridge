spring:
  application:
    name: sheetbridge
  datasource:
    url: jdbc:h2:file:./data/sheetbridge;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

sheetbridge:
  actor-header: X-Actor
  default-actor: system
  cors-origins: http://localhost:5173,http://127.0.0.1:5173
  sync:
    batch-size: 10
    backoff-base-ms: 100
    backoff-max-ms: 8000
    sheets-max-attempts: 6
  google:
    access-token: ${GOOGLE_SHEETS_TOKEN:}
    application-credentials: ${GOOGLE_APPLICATION_CREDENTIALS:}
