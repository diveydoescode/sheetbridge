spring:
  datasource:
    url: jdbc:h2:mem:sheetbridge_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: false

sheetbridge:
  seed: false
  cors-origins: http://localhost:5173
  sync:
    batch-size: 3
    backoff-base-ms: 1
    backoff-max-ms: 20
    sheets-max-attempts: 4
